<style>
  :root{--ink:#16130e;--ink-soft:#413a31;--bg-top:#e9f1f7;--bg-bottom:#f7f2e9;--accent:#2f7d32;--accent-link:#2c6ab5;--blue-600:#1757a0;--pill-dark:#191919}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--bg-top) 0%,#f3f2ec 55%,var(--bg-bottom) 100%);
    min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  }
  .skip{position:absolute;left:-9999px;top:0}
  .skip:focus{left:24px;top:24px;z-index:10;background:#fff;color:var(--ink);font-weight:600;padding:11px 20px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px;width:100%}
  nav{padding:28px 0}
  .wordmark{display:inline-flex;align-items:center;text-decoration:none}
  .wordmark img{height:26px;width:auto;display:block}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:40px 0 72px}
  .code{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:.9rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:540;font-size:clamp(2.1rem,6vw,3.2rem);line-height:1.1;letter-spacing:-.02em;margin:14px 0 0}
  h1 em{font-style:italic}
  p.sub{max-width:440px;margin:20px auto 0;font-size:1.02rem;line-height:1.6;color:var(--ink-soft)}
  .ctas{display:flex;gap:13px;justify-content:center;margin-top:32px;flex-wrap:wrap}
  .btn{font-size:1rem;font-weight:600;text-decoration:none;padding:14px 28px;border-radius:999px;transition:transform .12s,background .15s}
  .btn:active{transform:scale(.97)}
  .btn-dark{background:var(--pill-dark);color:#fff}
  .btn-dark:hover{background:#000}
  .btn-light{background:rgba(255,255,255,.78);color:var(--ink);border:1px solid rgba(0,0,0,.1)}
  .btn-light:hover{background:#fff}
  .links{margin-top:30px;font-size:.9rem;color:var(--ink-soft)}
  .links a{color:var(--ink-soft);margin:0 9px}
  footer{padding:0 0 40px;text-align:center;font-size:.84rem;line-height:1.5;color:var(--ink-soft)}
  footer a{color:var(--accent-link)}
  a:hover{color:var(--blue-600)}
  .links a:hover,footer a:hover{color:var(--accent-link)}
  a:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<!-- Analytics: Plausible. Cookieless and no personal data, so it needs no consent

<script defer data-domain="calledit.bet" src="https://plausible.io/js/script.js"></script>
</head>
